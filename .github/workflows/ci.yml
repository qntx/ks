name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  taplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes @taplo/cli@0.7.0 fmt --check

  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli2@0.23.3 "*.md" "skills/**/*.md"

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      deny: true
      doc: true
      package-check: true

  # ci-rust.yml requires a Debian-like runner (apt); test on the other two
  # target platforms directly.
  test-macos-windows:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: qntx/workflows/actions/hardened-checkout@v2
      - uses: qntx/workflows/actions/setup-rust@v2
      - run: cargo test --workspace --all-features

  # The fixture vault must recover with the official age CLI alone (G3);
  # vault-identity.txt is the decrypted .identity.age — public test
  # material since the fixture passphrase is committed in vault.json.
  age-recovery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age jq
      - run: age --version
      - name: decrypt every entry with age -d -i and verify header + payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find vectors/vault -name '*.age' ! -name '.*' | sort)
          want="$(jq '.entries | length' vectors/vault.json)"
          [ "${#files[@]}" -eq "$want" ] || { echo "found ${#files[@]} entries, expected $want"; exit 1; }
          for f in "${files[@]}"; do
            out="$(age -d -i vectors/vault-identity.txt "$f")"
            header="$(printf '%s' "$out" | head -n1)"
            [[ "$header" == ks1\ *\ * ]] || { echo "$f: bad header: $header"; exit 1; }
            kind="${header#ks1 }"; kind="${kind%% *}"
            name="${header##* }"
            path="vectors/vault/$name.age"
            [ "$f" = "$path" ] || { echo "$f: name $name != path"; exit 1; }
            payload="$(printf '%s' "$out" | tail -n +2)"
            expected="$(jq -r --arg n "$name" '.entries[] | select(.name==$n) | .payload // empty' vectors/vault.json)"
            if [ -n "$expected" ]; then
              [ "$payload" = "$expected" ] || { echo "$f: payload mismatch"; exit 1; }
            fi
            echo "$name: ok ($kind)"
          done
