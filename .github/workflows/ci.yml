name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      deny: true
      doc: true
      package-check: true

  # ci-rust.yml requires a Debian-like runner (apt); test on the other two
  # target platforms directly.
  test-macos-windows:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: qntx/workflows/actions/hardened-checkout@v2
      - uses: qntx/workflows/actions/setup-rust@v2
      - run: cargo test --workspace --all-features
