[package]
name         = "ks"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
authors      = { workspace = true }
description  = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }

[features]
default  = []
agent    = ["dep:interprocess", "dep:serde", "dep:base64", "dep:serde_json"]
keychain = ["dep:keyring-core", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store"]

[dependencies]
age          = { workspace = true }
age-core     = { workspace = true }
sha2         = { workspace = true }
tempfile     = { workspace = true }
fd-lock      = { workspace = true }
directories  = { workspace = true }
totp-rs      = { workspace = true }
interprocess = { workspace = true, optional = true }
serde        = { workspace = true, optional = true }
serde_json   = { workspace = true, optional = true }
base64       = { workspace = true, optional = true }
thiserror    = { workspace = true }
zeroize      = { workspace = true }
rand         = { workspace = true }
zxcvbn       = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
which                      = { workspace = true }
keyring-core               = { workspace = true, optional = true }
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
keyring-core                 = { workspace = true, optional = true }
windows-native-keyring-store = { workspace = true, optional = true }

[dev-dependencies]
proptest   = { workspace = true }
serde_json = { workspace = true, optional = false }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
